<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador del Examen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 800px;
        }
        .timer {
            font-size: 180px;
            font-weight: bold;
            color: red;
        }
        .timer-container {
            margin: 20px 0;
        }
        #message {
            font-size: 24px;
            color: green;
        }
        .exam-info {
            font-size: 20px;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-info img {
            height: 50px;
        }
        .header-info .local-time {
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-info">
            <img src="logo.png" alt="Logo del colegio"> <!-- Asegúrate de tener el logo en el mismo directorio -->
            <div id="localTime" class="local-time"></div>
        </div>
        
        <h1>MOCKS IB 2025 - COLEGIO LAMATEPEC</h1>

        <div class="exam-info" id="examList"></div>

        <div class="timer-container">
            <div id="timer" class="timer">00:00:00</div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        let readingTime = parseInt(localStorage.getItem("readingTime") || 5) * 60; // Predeterminado 5 minutos
        let examHours = parseInt(localStorage.getItem("examHours") || 1); // Predeterminado 1 hora
        let examMinutes = parseInt(localStorage.getItem("examMinutes") || 0); // Predeterminado 0 minutos
        let examTime = (examHours * 3600) + (examMinutes * 60); // Convertir todo a segundos
        let examNames = JSON.parse(localStorage.getItem("examNames")) || ["Examen 1", "Examen 2"]; // Predeterminado

        document.getElementById("examList").innerHTML = "<strong>Exámenes:</strong><br>" + examNames.filter(e => e).join("<br>");

        let timerElement = document.getElementById("timer");
        let messageElement = document.getElementById("message");

        let isReading = true;
        let totalTime = readingTime;

        // Función para mostrar la hora local en tiempo real
        function updateLocalTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('localTime').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // Función para reproducir la voz
        function playVoice(message) {
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'es-ES'; // Idioma español
            speechSynthesis.speak(utterance);
        }

        function startTimer() {
            let interval = setInterval(() => {
                let hours = Math.floor(totalTime / 3600);
                let minutes = Math.floor((totalTime % 3600) / 60);
                let seconds = totalTime % 60;

                timerElement.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                if (isReading && totalTime <= 0) {
                    // Fin de tiempo de lectura
                    playVoice("Tiempo de lectura terminado");
                    messageElement.textContent = "Tiempo de lectura terminado";
                    isReading = false;
                    totalTime = examTime; // Cambia al tiempo de examen
                    timerElement.style.color = "black"; // Cambia a color negro
                    setTimeout(() => messageElement.textContent = '', 2000); // Mensaje desaparecerá después de 2 segundos
                }

                if (!isReading && totalTime <= 0) {
                    clearInterval(interval);
                    alert("El examen ha finalizado.");
                }

                totalTime--;
            }, 1000);
        }

        // Actualizar la hora local cada segundo
        setInterval(updateLocalTime, 1000);

        startTimer();
    </script>

</body>
</html>
